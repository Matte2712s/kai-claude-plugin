# A tag push (vX.Y.Z) builds kai-X.Y.Z.zip from plugins/kai, validates that exact
# artifact and attaches it to a GitHub release. The zip is for the "upload .zip"
# install path of claude.ai, Claude Desktop and Cowork; Claude Code installs from
# the marketplace instead. The tag must equal "v" + the plugin.json version.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests of the checks and of the build
        run: python -m unittest discover -s tests -v

      - name: Check the tree
        run: python scripts/check_tree.py

      - name: Check the skills against the contract
        run: python scripts/check_contract.py

      # The tag reaches the script through the environment, never through the shell text
      - name: Build the release zip
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/build_release.py --tag "$TAG" --out dist --notes dist/notes.md

      # Validate what was built, not the source tree
      - name: Extract the zip
        run: |
          mkdir "$RUNNER_TEMP/extracted"
          python -m zipfile -e dist/kai-*.zip "$RUNNER_TEMP/extracted"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Keep the version in step with ci.yml
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.310

      # claude plugin validate needs no login, API key or network, so no secret is passed.
      # The variables only stop the CLI from phoning home or updating itself.
      - name: Validate the extracted zip
        env:
          DISABLE_TELEMETRY: "1"
          DISABLE_AUTOUPDATER: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: claude plugin validate --strict "$RUNNER_TEMP/extracted"

      - name: Validate the marketplace
        env:
          DISABLE_TELEMETRY: "1"
          DISABLE_AUTOUPDATER: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: claude plugin validate --strict .

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/kai-*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "kai $TAG" \
            --notes-file dist/notes.md \
            --verify-tag
